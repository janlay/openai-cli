name: Shellcheck

on:
  push:
    paths:
      - openai
      - .github/workflows/shellcheck.yml
  pull_request:
    paths:
      - openai
      - .github/workflows/shellcheck.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck openai
